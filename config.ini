# SoundLevel 配置（改完要重启程序才生效）
# 数值都用小数点，比如 -12.5

# 目标响度（峰值包络，dBFS）。越小越安静、压得越狠
target=-12

# 响度突然变大时的反应速度（毫秒）。太小会"抽气"
attack=200

# 声音变安静后恢复的速度（毫秒）。太小会跟着音乐抖
release=2500

# 最多提升多少 dB（受限于 Windows 的 100% 上限，实际经常抬不上去）
max_boost=12

# 最多压低多少 dB
max_cut=24

# 低于这个电平就不动了（防止把底噪拉满）
gate=-55

# 总线峰值保护：总和快削波时整体回退
safety=1

# 1 = 无视你自己在音量混合器里的设置（不建议）
absolute=0

# 1 = 连系统提示音也处理
system_sounds=0

# 不处理的进程，逗号分隔，例如：chrome,QQMusic
ignore=
